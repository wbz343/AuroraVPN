name: Windows Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_override:
        description: 'Override version tag (e.g., v1.0.0)'
        required: false
        default: 'v0.1.0'

jobs:
  build-windows:
    name: Build Windows Client
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Version Tag
        id: get_version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_override }}" ]; then
            echo "TAG=${{ github.event.inputs.tag_override }}" >> "$GITHUB_ENV"
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Mingw-w64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Installing MinGW..."
          choco install mingw -y --no-progress

          $candidateDirs = @(
            'C:\ProgramData\chocolatey\bin',
            'C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin',
            'C:\ProgramData\mingw64\mingw64\bin',
            'C:\tools\mingw64\bin',
            'C:\msys64\mingw64\bin',
            'C:\msys64\usr\bin',
            'C:\mingw64\bin',
            'C:\mingw\bin'
          )

          $cc = $null
          $binDir = $null

          foreach ($dir in $candidateDirs) {
            if (-not $dir -or -not (Test-Path $dir)) { continue }

            $candidate = Join-Path $dir 'x86_64-w64-mingw32-gcc.exe'
            if (Test-Path $candidate) {
              $cc = $candidate
              $binDir = $dir
              break
            }

            $fallback = Join-Path $dir 'gcc.exe'
            if (Test-Path $fallback) {
              $cc = $fallback
              $binDir = $dir
              break
            }
          }

          if (-not $cc) {
            $checked = ($candidateDirs | ForEach-Object {
              if ($_ -and (Test-Path $_)) {
                "($_) => { x86_64-w64-mingw32-gcc.exe: $((Test-Path (Join-Path $_ 'x86_64-w64-mingw32-gcc.exe'))); gcc.exe: $((Test-Path (Join-Path $_ 'gcc.exe'))) }"
              } else {
                "$($_) => not found"
              }
            }) -join '; '
            throw "MinGW compiler not found. Checked: $checked"
          }

          $env:Path = "$binDir;$env:Path"
          $env:GITHUB_PATH = "$binDir;$env:GITHUB_PATH"

          Write-Host "Using compiler: $cc" -ForegroundColor Green
          & $cc --version

      - name: Verify GCC toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "PATH=$env:PATH"
          where.exe gcc
          where.exe x86_64-w64-mingw32-gcc
          if (Get-Command gcc -ErrorAction SilentlyContinue) {
            gcc --version
          }
          if (Get-Command x86_64-w64-mingw32-gcc -ErrorAction SilentlyContinue) {
            x86_64-w64-mingw32-gcc --version
          }

      - name: Initialize and Build Native Go Components (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "=== Step 1: Running setup scripts to fetch dependencies ===" -ForegroundColor Cyan
          ./native/chain/setup.ps1
          ./native/tor/setup.ps1
          if (Test-Path "./native/psiphon/setup.ps1") {
            ./native/psiphon/setup.ps1
          }

          Write-Host "=== Step 2: Building for Windows platform ===" -ForegroundColor Cyan
          ./native/chain/build.ps1 -Platform windows
          ./native/tor/build.ps1 -Platform windows

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate App Icons
        run: npx @tauri-apps/cli icon assets/brand/whiteaesther-logo.png

      - name: Download wintun DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $projectDir = Join-Path $env:GITHUB_WORKSPACE 'src-tauri'
          $dllPath = Join-Path $projectDir 'wintun.dll'
          $zipPath = Join-Path $env:RUNNER_TEMP 'wintun.zip'
          $tmpDir = Join-Path $env:RUNNER_TEMP 'wintun'

          $ExpectedHash = '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'

          if (Test-Path $dllPath) {
            $existing = Get-FileHash $dllPath -Algorithm SHA256
            if ($existing.Hash -eq $ExpectedHash.ToUpper()) {
              Write-Host "wintun.dll already in repo and verified, skip download" -ForegroundColor Green
              exit 0
            }
            Write-Warning "Existing wintun.dll hash mismatch, re-downloading"
            Remove-Item $dllPath -Force
          }

          if (Test-Path $tmpDir) { Remove-Item $tmpDir -Recurse -Force }
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }

          $urls = @(
            'https://www.wintun.net/builds/wintun-0.14.1.zip',
            'https://github.com/WireGuard/wintun/releases/download/0.14.1/wintun-amd64.zip'
          )

          $ok = $false
          foreach ($url in $urls) {
            try {
              Write-Host "Downloading $url" -ForegroundColor Cyan
              for ($attempt = 1; $attempt -le 3; $attempt++) {
                try {
                  Invoke-WebRequest -Uri $url -OutFile $zipPath -UseBasicParsing -UserAgent 'Mozilla/5.0'
                  break
                }
                catch {
                  if ($attempt -eq 3) { throw }
                  Write-Warning "Download attempt $attempt failed: $($_.Exception.Message). Retrying in 5s..."
                  Start-Sleep -Seconds 5
                }
              }
              $ok = $true
              break
            }
            catch {
              Write-Warning "Fail: $($_.Exception.Message)"
            }
          }

          if (-not $ok) { throw 'wintun download failed' }

          Expand-Archive -Path $zipPath -DestinationPath $tmpDir -Force

          $dll = Get-ChildItem -Path $tmpDir -Recurse -Filter 'wintun.dll' |
                 Where-Object { $_.FullName -match 'amd64' } |
                 Select-Object -First 1

          if (-not $dll) {
            $dll = Get-ChildItem -Path $tmpDir -Recurse -Filter 'wintun.dll' | Select-Object -First 1
          }

          if (-not $dll) { throw 'wintun.dll not found in archive' }

          Copy-Item $dll.FullName $dllPath -Force

          $finalHash = Get-FileHash $dllPath -Algorithm SHA256
          Write-Host "wintun.dll SHA256: $($finalHash.Hash)" -ForegroundColor Cyan
          Write-Host "wintun.dll ready at $dllPath" -ForegroundColor Green

      - name: Validate build artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $required = @(
            'native/chain/build/windows/amd64/auroravpn-core.exe',
            'native/tor/build/windows/amd64/lyrebird.exe',
            'native/tor/build/windows/amd64/snowflake.exe',
            'src-tauri/wintun.dll'
          )

          foreach ($p in $required) {
            $full = Join-Path $env:GITHUB_WORKSPACE $p
            if (-not (Test-Path $full)) {
              throw "Missing required build artifact: $p"
            }
            Write-Host "OK: $p" -ForegroundColor Green
          }

      - name: Build Frontend
        working-directory: src
        run: |
          npm install
          npm run build

      - name: Import Code Signing Certificate
        if: env.WIN_CERT_BASE64 != ''
        shell: pwsh
        env:
          WIN_CERT_BASE64: ${{ secrets.WIN_CERT_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          $certBytes = [Convert]::FromBase64String($env:WIN_CERT_BASE64)
          $certPath = Join-Path $env:RUNNER_TEMP "certificate.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          echo "WIN_CERT_PATH=$certPath" >> $env:GITHUB_ENV

      - name: Validate Tauri inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot = $env:GITHUB_WORKSPACE
          $projectRoot = Join-Path $repoRoot 'src-tauri'

          $required = @(
            (Join-Path $projectRoot 'wintun.dll'),
            (Join-Path $repoRoot 'native/chain/build/windows/amd64/auroravpn-core.exe'),
            (Join-Path $repoRoot 'native/tor/build/windows/amd64/lyrebird.exe'),
            (Join-Path $repoRoot 'native/tor/build/windows/amd64/snowflake.exe'),
            (Join-Path $projectRoot 'icons/icon.ico')
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Tauri build prerequisite missing: $file"
            }
          }

          Write-Host "All Tauri build prerequisites are present." -ForegroundColor Green

      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          args: "--verbose"
          
          # === 自动创建 Release 并上传产物的关键配置 ===
          tagName: ${{ env.TAG }}
          releaseName: "Release ${{ env.TAG }}"
          releaseBody: "See the assets to download and install this version."
          releaseDraft: false
          prerelease: false
