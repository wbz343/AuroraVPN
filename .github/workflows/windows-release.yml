name: Windows Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_override:
        description: 'Override version tag (e.g., v1.0.0)'
        required: false
        default: 'v0.1.0'

jobs:
  build-windows:
    name: Build Windows Client
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Version Tag
        id: get_version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_override }}" ]; then
            echo "TAG=${{ github.event.inputs.tag_override }}" >> $GITHUB_ENV
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Mingw-w64
        shell: pwsh
        run: |
          choco install mingw -y --no-progress

          $mingwBin = "C:\ProgramData\mingw64\mingw64\bin"
          if (Test-Path $mingwBin) {
            echo $mingwBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "Added $mingwBin to PATH" -ForegroundColor Green
          } else {
            $chocoPath = "C:\tools\mingw64\bin"
            if (Test-Path $chocoPath) {
              echo $chocoPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              Write-Host "Added $chocoPath to PATH" -ForegroundColor Green
            } else {
              throw "mingw64 bin directory not found after installation"
            }
          }

          & "$mingwBin\gcc.exe" --version

      - name: Initialize and Build Native Go Components (Windows)
        shell: pwsh
        run: |
          Write-Host "=== Step 1: Running setup scripts to fetch dependencies ===" -ForegroundColor Cyan
          ./native/chain/setup.ps1
          ./native/tor/setup.ps1
          if (Test-Path "./native/psiphon/setup.ps1") {
            ./native/psiphon/setup.ps1
          }

          Write-Host "=== Step 2: Building for Windows platform ===" -ForegroundColor Cyan
          ./native/chain/build.ps1 -Platform windows
          ./native/tor/build.ps1 -Platform windows

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download wintun DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $projectDir = Join-Path $env:GITHUB_WORKSPACE 'src-tauri'
          $dllPath = Join-Path $projectDir 'wintun.dll'
          $zipPath = Join-Path $env:RUNNER_TEMP 'wintun.zip'
          $tmpDir = Join-Path $env:RUNNER_TEMP 'wintun'

          $ExpectedHash = '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'

          if (Test-Path $dllPath) {
            $existing = Get-FileHash $dllPath -Algorithm SHA256
            if ($existing.Hash -eq $ExpectedHash.ToUpper()) {
              Write-Host "wintun.dll already in repo and verified, skip download" -ForegroundColor Green
              exit 0
            } else {
              Write-Warning "Existing wintun.dll hash mismatch, re-downloading"
              Remove-Item $dllPath -Force
            }
          }

          if (Test-Path $tmpDir) { Remove-Item $tmpDir -Recurse -Force }
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }

          $urls = @(
            'https://www.wintun.net/builds/wintun-0.14.1.zip',
            'https://github.com/WireGuard/wintun/releases/download/0.14.1/wintun-amd64.zip'
          )

          $ok = $false
          foreach ($url in $urls) {
            try {
              Write-Host "Downloading $url" -ForegroundColor Cyan
              Invoke-WebRequest `
                -Uri $url `
                -OutFile $zipPath `
                -UseBasicParsing `
                -UserAgent "Mozilla/5.0" `
                -MaximumRetryCount 3 `
                -RetryIntervalSec 5
              $ok = $true
              break
            } catch {
              Write-Warning "Fail: $($_.Exception.Message)"
            }
          }

          if (-not $ok) { throw 'wintun download failed' }

          Expand-Archive -Path $zipPath -DestinationPath $tmpDir -Force

          $dll = Get-ChildItem -Path $tmpDir -Recurse -Filter 'wintun.dll' |
                 Where-Object { $_.FullName -match 'amd64' } |
                 Select-Object -First 1

          if (-not $dll) {
            $dll = Get-ChildItem -Path $tmpDir -Recurse -Filter 'wintun.dll' | Select-Object -First 1
          }

          if (-not $dll) { throw 'wintun.dll not found in archive' }

          Copy-Item $dll.FullName $dllPath -Force

          $finalHash = Get-FileHash $dllPath -Algorithm SHA256
          Write-Host "wintun.dll SHA256: $($finalHash.Hash)" -ForegroundColor Cyan
          Write-Host "wintun.dll ready at $dllPath" -ForegroundColor Green

      - name: Install Frontend Dependencies
        working-directory: src
        run: npm install

      - name: Import Code Signing Certificate
        if: env.WIN_CERT_BASE64 != ''
        shell: pwsh
        env:
          WIN_CERT_BASE64: ${{ secrets.WIN_CERT_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          $certBytes = [Convert]::FromBase64String($env:WIN_CERT_BASE64)
          $certPath = Join-Path $env:RUNNER_TEMP "certificate.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          echo "WIN_CERT_PATH=$certPath" >> $env:GITHUB_ENV

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          args: "--verbose"

      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${{ env.TAG }}" src-tauri/target/release/bundle/msi/*.msi src-tauri/target/release/bundle/nsis/*.exe --clobber || true
