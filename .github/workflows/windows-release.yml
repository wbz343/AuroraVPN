
name: Windows Release Build

on:
  push:
    tags:
      - 'v*' # 仅当推送 v1.0.0 这样的标签时触发
  workflow_dispatch: # 允许手动触发
    inputs:
      tag_override:
        description: 'Override version tag (e.g., v1.0.0)'
        required: false
        default: 'v0.1.0'

jobs:
  build-windows:
    name: Build Windows Client
    runs-on: windows-latest
    permissions:
      contents: write # 允许创建 Release 并上传资产
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Version Tag
        id: get_version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_override }}" ]; then
            echo "TAG=${{ github.event.inputs.tag_override }}" >> $GITHUB_ENV
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      # 1. 设置 Go 环境 (用于编译 Chain, Tor 等 Go 组件为 Windows DLL)
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # 2. 安装 Mingw-w64 (Go CGO 编译 Windows DLL 必需的 C 编译器)
      - name: Install Mingw-w64
        run: |
          choco install mingw -y
          echo "C:\tools\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 3. 编译 Go 组件为 Windows DLL (需确保你的 ps1 脚本支持 GOOS=windows)
      - name: Build Native Go Components (Windows)
        shell: pwsh
        run: |
          $env:GOOS="windows"
          $env:GOARCH="amd64"
          $env:CGO_ENABLED="1"
          $env:CGO_CFLAGS="-O2 -g"
          
          # 如果脚本存在则执行，假设它们已被修改为输出 .dll 而非 .so
          if (Test-Path "native/chain/build.ps1") { ./native/chain/build.ps1 }
          if (Test-Path "native/tor/build.ps1") { ./native/tor/build.ps1 }
          if (Test-Path "native/psiphon/setup.ps1") { ./native/psiphon/setup.ps1 }

      # 4. 设置 Rust 环境
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # 5. 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'src/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm --prefix src ci

      # 6. (可选) 导入 Windows 代码签名证书，消除 SmartScreen 警告
      - name: Import Code Signing Certificate
        if: env.WIN_CERT_BASE64 != ''
        shell: pwsh
        env:
          WIN_CERT_BASE64: ${{ secrets.WIN_CERT_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          $certBytes = [Convert]::FromBase64String($env:WIN_CERT_BASE64)
          $certPath = Join-Path $env:RUNNER_TEMP "certificate.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          echo "WIN_CERT_PATH=$certPath" >> $env:GITHUB_ENV

      # 7. 使用 Tauri Action 构建并打包应用
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 如果配置了 Tauri 更新签名，请取消注释以下两行并在 Secrets 中添加对应值
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          args: "--verbose"

      # 8. 将生成的 .msi 或 .exe 上传到 GitHub Release
      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Tauri 默认输出路径
          gh release upload "${{ env.TAG }}" target/release/bundle/msi/*.msi target/release/bundle/nsis/*.exe --clobber || true
