name: Windows Release Build

on:
  push:
    tags:
      - 'v*' # 仅当推送 v1.0.0 这样的标签时触发
  workflow_dispatch: # 允许手动触发
    inputs:
      tag_override:
        description: 'Override version tag (e.g., v1.0.0)'
        required: false
        default: 'v0.1.0'

jobs:
  build-windows:
    name: Build Windows Client
    runs-on: windows-latest
    permissions:
      contents: write # 允许创建 Release 并上传资产
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Version Tag
        id: get_version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_override }}" ]; then
            echo "TAG=${{ github.event.inputs.tag_override }}" >> $GITHUB_ENV
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      # 1. 设置 Go 环境
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # 根据你项目 go.mod 的版本调整

      # 2. 安装 Mingw-w64 (Go CGO 编译 Windows DLL 必需的 C 编译器)
      - name: Install Mingw-w64
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          # 确保 gcc 在 PATH 中
          $mingwBin = "C:\tools\mingw64\bin"
          if (Test-Path $mingwBin) {
              echo $mingwBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
              # 备用路径检查
              $altPath = (Get-Command gcc -ErrorAction SilentlyContinue).Source | Split-Path
              if ($altPath) { echo $altPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          }
          gcc --version # 验证安装

      # 3. 初始化依赖并编译 Go 组件为 Windows DLL (核心修复步骤)
      - name: Initialize and Build Native Go Components (Windows)
        shell: pwsh
        run: |
          Write-Host "=== Step 1: Running setup scripts to fetch dependencies ===" -ForegroundColor Cyan
          # 必须先运行 setup 脚本，拉取 third_party 依赖 (如 flclash/core, snowflake 等)
          ./native/chain/setup.ps1
          ./native/tor/setup.ps1
          if (Test-Path "./native/psiphon/setup.ps1") {
              ./native/psiphon/setup.ps1
          }
          
          Write-Host "=== Step 2: Building for Windows platform ===" -ForegroundColor Cyan
          # 显式指定 Platform 为 windows，触发我们修改后的构建分支
          ./native/chain/build.ps1 -Platform windows
          ./native/tor/build.ps1 -Platform windows

      # 4. 设置 Rust 环境
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # 5. 设置 Node.js 环境 (暂时禁用缓存以避免 lock 文件缺失报错)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # 注释掉或删除 cache 和 cache-dependency-path
          # cache: 'npm'
          # cache-dependency-path: 'src/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm --prefix src install

      # 6. (可选) 导入 Windows 代码签名证书
      - name: Import Code Signing Certificate
        if: env.WIN_CERT_BASE64 != ''
        shell: pwsh
        env:
          WIN_CERT_BASE64: ${{ secrets.WIN_CERT_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          $certBytes = [Convert]::FromBase64String($env:WIN_CERT_BASE64)
          $certPath = Join-Path $env:RUNNER_TEMP "certificate.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          echo "WIN_CERT_PATH=$certPath" >> $env:GITHUB_ENV

      # 7. 使用 Tauri Action 构建并打包应用
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          args: "--verbose"

      # 8. 将生成的 .msi 或 .exe 上传到 GitHub Release
      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Tauri 默认输出路径
          gh release upload "${{ env.TAG }}" target/release/bundle/msi/*.msi target/release/bundle/nsis/*.exe --clobber || true
